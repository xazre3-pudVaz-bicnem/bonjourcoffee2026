name: Daily Blog Post

# 毎日 9:17 JST（= 00:17 UTC）に自動実行。手動実行も可能。
on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate daily blog post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 任意。未設定なら Haiku（claude-haiku-4-5）を使用。
          # モデルを変えたい場合はリポジトリ変数 ANTHROPIC_MODEL を設定。
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: npx tsx scripts/generate-daily-post.ts

      - name: Commit & push
        run: |
          git config user.name "bonjour-coffee-blog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/blog

          if git diff --cached --quiet; then
            echo "変更なし（新しい記事は生成されませんでした）。正常終了します。"
            exit 0
          fi

          NEW_FILES=$(git diff --cached --name-only --diff-filter=A -- content/blog)
          echo "新規記事ファイル:"
          echo "$NEW_FILES"

          git commit -m "chore(blog): 自動生成した記事を追加 ($(date +'%Y-%m-%d'))"
          git push origin HEAD:main
          echo "push 完了: main ブランチへ反映しました。"
